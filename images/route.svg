<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 660" font-family="Segoe UI,Arial,sans-serif"><rect width="360" height="660" rx="14" fill="#f7f5ef"/><rect x="20" y="54" width="75" height="42" fill="#9aa5b1" stroke="#3b4a5a" stroke-width="2"/><rect x="28" y="26" width="12" height="30" fill="#6b7683"/><rect x="50" y="26" width="12" height="30" fill="#6b7683"/><circle cx="36" cy="24" r="5" fill="#cfd5db"/><circle cx="58" cy="20" r="6" fill="#cfd5db"/><text x="125" y="50" font-size="15" font-weight="700" fill="#1d2227">Електростанція</text><text x="125" y="70" font-size="13" font-weight="400" fill="#5d666e">тут крутиться генератор</text><text x="125" y="87" font-size="13" font-weight="600" fill="#c8501e">напруга ≈ 10 000 В</text><path d="M58 102v14l-6-7m6 7l6-7" stroke="#3b4a5a" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="25" y="147" width="70" height="42" fill="#c9d1d9" stroke="#3b4a5a" stroke-width="2"/><path d="M40 147v-18M60 147v-18M80 147v-18" stroke="#3b4a5a" stroke-width="4"/><text x="48" y="179" font-size="22" fill="#c8501e" font-weight="700">↑</text><text x="125" y="155" font-size="15" font-weight="700" fill="#1d2227">Підвищувальна підстанція</text><text x="125" y="175" font-size="13" font-weight="400" fill="#5d666e">піднімає напругу, щоб</text><text x="125" y="192" font-size="13" font-weight="400" fill="#5d666e">менше втрачати в проводах</text><path d="M58 207v14l-6-7m6 7l6-7" stroke="#3b4a5a" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M57 238L40 296M57 238L74 296M38 256H76M44 274H70" stroke="#3b4a5a" stroke-width="3" fill="none"/><path d="M10 256H104M10 270H104" stroke="#6b7683" stroke-width="1.5"/><text x="125" y="260" font-size="15" font-weight="700" fill="#1d2227">Лінії електропередач</text><text x="125" y="280" font-size="13" font-weight="400" fill="#5d666e">сотні тисяч вольт,</text><text x="125" y="297" font-size="13" font-weight="400" fill="#5d666e">тонкі дроти, малі втрати</text><path d="M58 312v14l-6-7m6 7l6-7" stroke="#3b4a5a" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="25" y="357" width="70" height="42" fill="#c9d1d9" stroke="#3b4a5a" stroke-width="2"/><path d="M40 357v-18M60 357v-18M80 357v-18" stroke="#3b4a5a" stroke-width="4"/><text x="48" y="389" font-size="22" fill="#c8501e" font-weight="700">↓</text><text x="125" y="365" font-size="15" font-weight="700" fill="#1d2227">Знижувальна підстанція</text><text x="125" y="385" font-size="13" font-weight="400" fill="#5d666e">знижує напругу</text><text x="125" y="402" font-size="13" font-weight="400" fill="#5d666e">до безпечнішої</text><path d="M58 417v14l-6-7m6 7l6-7" stroke="#3b4a5a" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="40" y="464" width="40" height="44" rx="4" fill="#b8c2cc" stroke="#3b4a5a" stroke-width="2"/><path d="M52 464v-10M68 464v-10" stroke="#3b4a5a" stroke-width="4"/><path d="M48 478h24M48 490h24" stroke="#6b7683" stroke-width="3"/><text x="125" y="470" font-size="15" font-weight="700" fill="#1d2227">Трансформатор біля будинку</text><text x="125" y="490" font-size="13" font-weight="400" fill="#5d666e">остання «знижувалка»</text><text x="125" y="507" font-size="13" font-weight="600" fill="#c8501e">до 230 / 400 В</text><path d="M58 522v14l-6-7m6 7l6-7" stroke="#3b4a5a" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M25 579L58 551L92 579" fill="#c8501e"/><rect x="33" y="579" width="50" height="32" fill="#e7d9c2" stroke="#3b4a5a" stroke-width="2"/><rect x="52" y="595" width="14" height="20" fill="#8a6a4a"/><rect x="38" y="589" width="10" height="10" fill="#8fb8de"/><text x="125" y="575" font-size="15" font-weight="700" fill="#1d2227">Ваш будинок</text><text x="125" y="595" font-size="13" font-weight="400" fill="#5d666e">лічильник, потім щит</text><text x="125" y="612" font-size="13" font-weight="400" fill="#5d666e">тут працює електрик</text></svg>