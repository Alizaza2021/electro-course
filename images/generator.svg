<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" font-family="Segoe UI,Arial,sans-serif"><rect width="360" height="560" rx="14" fill="#f7f5ef"/><rect x="25" y="55" width="90" height="55" rx="6" fill="#8fb8de" stroke="#3b4a5a" stroke-width="2"/><path d="M35 80q10-8 20 0t20 0t20 0" fill="none" stroke="#fff" stroke-width="3"/><path d="M55 140q-12-14 0-28q4 10 14 4q8 12-2 24z" fill="#e8742a"/><path d="M85 140q-8-10 0-20q3 7 9 3q6 9-1 17z" fill="#f2b134"/><path d="M45 40q4-10 0-18M70 40q4-10 0-18M95 40q4-10 0-18" stroke="#9aa5b1" stroke-width="3" fill="none" stroke-linecap="round"/><text x="135" y="70" font-size="15" font-weight="700" fill="#1d2227">1. Воду нагрівають,</text><text x="135" y="90" font-size="15" font-weight="400" fill="#1d2227">вона стає парою</text><text x="135" y="112" font-size="13" font-weight="400" fill="#5d666e">(вугілля, газ, атом)</text><circle cx="70" cy="215" r="38" fill="#e9e6dd" stroke="#3b4a5a" stroke-width="2"/><path d="M70 215L104 215" stroke="#3b4a5a" stroke-width="5" stroke-linecap="round"/><path d="M70 215L87 244" stroke="#3b4a5a" stroke-width="5" stroke-linecap="round"/><path d="M70 215L53 244" stroke="#3b4a5a" stroke-width="5" stroke-linecap="round"/><path d="M70 215L36 215" stroke="#3b4a5a" stroke-width="5" stroke-linecap="round"/><path d="M70 215L53 186" stroke="#3b4a5a" stroke-width="5" stroke-linecap="round"/><path d="M70 215L87 186" stroke="#3b4a5a" stroke-width="5" stroke-linecap="round"/><circle cx="70" cy="215" r="6" fill="#c8501e"/><path d="M25 190a50 50 0 0 1 30-25" fill="none" stroke="#c8501e" stroke-width="3"/><path d="M58 160l-6 8l10 2z" fill="#c8501e"/><text x="135" y="205" font-size="15" font-weight="700" fill="#1d2227">2. Пара крутить</text><text x="135" y="225" font-size="15" font-weight="400" fill="#1d2227">турбіну</text><text x="135" y="247" font-size="13" font-weight="400" fill="#5d666e">(як вітер крутить вітряк)</text><polyline points="20,330 30,308 40,352 50,308 60,352 70,308 80,352 90,308 100,330" fill="none" stroke="#b9702e" stroke-width="4" stroke-linejoin="round"/><rect x="40" y="318" width="30" height="24" fill="#d94b3d"/><rect x="70" y="318" width="30" height="24" fill="#3c6fd6"/><text x="49" y="335" font-size="13" font-weight="700" fill="#fff">N</text><text x="79" y="335" font-size="13" font-weight="700" fill="#fff">S</text><path d="M55 300a30 30 0 0 1 35 0" fill="none" stroke="#c8501e" stroke-width="3"/><path d="M92 296l-9 0l5 8z" fill="#c8501e"/><text x="135" y="325" font-size="15" font-weight="700" fill="#1d2227">3. Турбіна крутить</text><text x="135" y="345" font-size="15" font-weight="400" fill="#1d2227">магніт у котушці</text><text x="135" y="367" font-size="13" font-weight="400" fill="#5d666e">з мідного дроту</text><circle cx="70" cy="450" r="26" fill="#fff3a8" stroke="#777" stroke-width="2"/><path d="M60 450q10-14 20 0" fill="none" stroke="#e28a00" stroke-width="2"/><rect x="58" y="474" width="24" height="14" rx="3" fill="#9a9fa4"/><path d="M20 420l-10-8M120 420l10-8M70 410v-14" stroke="#f2b134" stroke-width="3" stroke-linecap="round"/><text x="135" y="445" font-size="15" font-weight="700" fill="#1d2227">4. У дроті з’являється</text><text x="135" y="465" font-size="15" font-weight="400" fill="#1d2227">електричний струм</text><path d="M70 150v14l-6-7m6 7l6-7" stroke="#3b4a5a" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M70 268v14l-6-7m6 7l6-7" stroke="#3b4a5a" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M70 380v14l-6-7m6 7l6-7" stroke="#3b4a5a" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="20" y="535" font-size="11.5" font-weight="400" fill="#5d666e">Так працюють ТЕС, АЕС і ГЕС. Різниця лише в тому, що крутить турбіну.</text></svg>